[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-leakage"
version = "0.1.0"
description = "Geração sintética para o experimento de reprodução em treinamento federado"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Faker==40.36.0",
]

[project.optional-dependencies]
model = [
  "huggingface-hub==0.33.4",
  "jsonschema==4.25.0",
  "PyYAML==6.0.2",
  "safetensors==0.5.3",
  "tokenizers==0.21.2",
  "torch==2.7.1",
  "transformers==4.53.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
federated_leakage = ["schemas/*.json"]
