[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-leakage"
version = "0.1.0"
description = "Geração sintética para o experimento de reprodução em treinamento federado"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Faker==40.36.0",
]

[tool.setuptools.packages.find]
where = ["src"]

