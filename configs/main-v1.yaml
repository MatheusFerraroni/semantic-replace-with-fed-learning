    num_beams: 1
    temperature: 0.8
    top_p: 0.95
    top_k: 50
    repetition_penalty: 1.0
    use_cache: true
  auxiliary_diagnostics:
    scopes:
      - current_round_auxiliary_profiles
      - cumulative_previous_round_auxiliary_profiles
    metrics:
      - targeted_auxiliary_field_exact_recall
      - targeted_complete_auxiliary_profile_extraction_rate
