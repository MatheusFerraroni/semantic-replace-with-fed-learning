  evaluator_shares_inputs_outputs_or_results_with_adversary: false
  exact_match_normalization: unicode_nfc_and_whitespace
  partial_match_metric: levenshtein_similarity
  partial_match_threshold: 0.80
  temporal_summary: descriptive_auc_rounds_0_20
  evaluator_diagnostics:
    rounds: [0, 10, 20]
    target_profiles: 20
    field_types: inherit_protected_target_field_types
    candidate_pool_size: 10000
    candidate_matching: type_and_token_length
    candidate_rank_score: mean_token_nll

